name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton & Fetch Dependencies
        run: |
          flutter create . --platforms=android --org=com.genesisspeech --project-name=genesis_speech_tab 2>&1 | tee -a /tmp/build.log
          python3 -m pip install --break-system-packages pillow 2>&1 | tee -a /tmp/build.log || sudo apt-get install -y python3-pil 2>&1 | tee -a /tmp/build.log
          python3 setup_android_build.py 2>&1 | tee -a /tmp/build.log
          flutter pub get 2>&1 | tee -a /tmp/build.log

      - name: Build Android Release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a /tmp/build.log

      - name: Rename APK for Easy Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk GenesisSpeechTab.apk
          cp GenesisSpeechTab.apk /tmp/GenesisSpeechTab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenesisSpeechTab-Android-APK
          path: GenesisSpeechTab.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Genesis Speech Tab (Android APK v1.0.0)
          body: |
            ## 🗣️ Genesis Speech Tab - Free Android APK
            
            Download `GenesisSpeechTab.apk` below and install it directly onto any Android or Amazon Fire tablet!
          files: GenesisSpeechTab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK and Log to apk-release Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-release
          git rm -rf .
          if [ -f /tmp/build.log ]; then cp /tmp/build.log build.log; git add -f build.log; fi
          if [ -f /tmp/GenesisSpeechTab.apk ]; then cp /tmp/GenesisSpeechTab.apk GenesisSpeechTab.apk; git add -f GenesisSpeechTab.apk; fi
          git commit -m "Build GenesisSpeechTab.apk and log" || true
          git push -f origin apk-release


