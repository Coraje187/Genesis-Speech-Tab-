name: genesis_speech_tab
description: A high-performance, free motor-planning AAC communicator for Android tablets.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/symbols/
